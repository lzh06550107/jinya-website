name: Rebuild walk-in image asset

on:
  push:
    paths:
      - '.github/workflows/rebuild-walkin-image.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild uploaded image asset
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .asset-chunks/walkin-01.b64 \
            .asset-chunks/walkin-02.b64 \
            .asset-chunks/walkin-03.b64 \
            .asset-chunks/walkin-04.b64 \
            .asset-chunks/walkin-05a.b64 \
            .asset-chunks/walkin-05b.b64 \
            .asset-chunks/walkin-05c.b64 \
            .asset-chunks/walkin-05d.b64 \
            .asset-chunks/walkin-06.b64 \
            .asset-chunks/walkin-07.b64 \
            .asset-chunks/walkin-08.b64 \
            | base64 -d > assets/img/walkin-home-bg.jpg

          actual="$(git hash-object assets/img/walkin-home-bg.jpg)"
          expected="0537b5ef8be4c2a34a08d896c6921f583e40dff3"
          echo "walk-in image blob: $actual"
          test "$actual" = "$expected"

      - name: Restore direct img reference
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")

          image_tag = '        <img class="walkin-hero-image" src="assets/img/walkin-home-bg.jpg" alt="金亚包装生产车间">\n'
          marker = '      <div class="walkin-hero">\n'
          if image_tag.strip() not in html:
              if marker not in html:
                  raise SystemExit("walkin-hero marker not found")
              html = html.replace(marker, marker + image_tag, 1)

          html = re.sub(r'assets/css/style\.css\?v=\d+', 'assets/css/style.css?v=45', html, count=1)
          index.write_text(html, encoding="utf-8")

          css_path = Path("assets/css/style.css")
          css = css_path.read_text(encoding="utf-8")
          css = css.replace(
              'background:#eef1f5 url("../img/walkin-home-bg.jpg") center center / cover no-repeat;',
              'background:#eef1f5;'
          )
          if 'url("../img/walkin-home-bg.jpg")' in css:
              raise SystemExit("CSS still references walkin-home-bg.jpg")
          css_path.write_text(css, encoding="utf-8")

      - name: Verify final HTML and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          grep -F '<img class="walkin-hero-image" src="assets/img/walkin-home-bg.jpg" alt="金亚包装生产车间">' index.html
          ! grep -F 'url("../img/walkin-home-bg.jpg")' assets/css/style.css
          rm -rf .asset-chunks
          rm -f .github/workflows/rebuild-walkin-image.yml

      - name: Commit final asset and markup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use img resource for homepage walk-in background"
          git push
