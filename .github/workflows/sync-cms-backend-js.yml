name: Sync CMS Backend JS

on:
  push:
    branches:
      - feature/dynamic-html-views-20260920
    paths:
      - ".github/cms-sync/**"
      - ".github/workflows/sync-cms-backend-js.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/dynamic-html-views-20260920
          fetch-depth: 0

      - name: Restore CMS backend JS from uploaded package
        shell: bash
        run: |
          set -euo pipefail
          cat .github/cms-sync/payload-*.b64 > /tmp/cms.tar.xz.b64
          base64 -d /tmp/cms.tar.xz.b64 > /tmp/cms.tar.xz
          echo "02421770ae86f8f1d1b4ed524ac0435308f64144e6454ffd06f1bdf0423b9a2c  /tmp/cms.tar.xz" | sha256sum -c -
          tar -xJf /tmp/cms.tar.xz
          test -d public/assets/js/backend/cms
          count="$(find public/assets/js/backend/cms -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')"
          test "$count" -eq 34
          while IFS= read -r file; do
            node --check "$file"
          done < <(find public/assets/js/backend/cms -maxdepth 1 -type f -name '*.js' | sort)

          rm -rf .github/cms-sync
          rm -f .github/workflows/sync-cms-backend-js.yml

      - name: Commit restored CMS backend assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/assets/js/backend/cms .github/cms-sync .github/workflows/sync-cms-backend-js.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(cms): restore backend controller assets"
          git push origin HEAD:feature/dynamic-html-views-20260920
