name: Assemble labels product images

on:
  push:
    branches: [main]
    paths:
      - '.asset-product-chunks/TRIGGER'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble product WebP images
        shell: bash
        run: |
          set -euo pipefail
          for i in 01 02 03 04 05 06 07 08 09; do
            cat .asset-product-chunks/p${i}-*.b64 | tr -d '\n\r ' | base64 -d > "assets/img/labels-product-${i}.webp"
            file "assets/img/labels-product-${i}.webp"
            test "$(stat -c%s "assets/img/labels-product-${i}.webp")" -gt 8000
          done

      - name: Update labels page image references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('labels.html')
          s = p.read_text(encoding='utf-8')
          for i in range(1, 10):
              old_jpg = f'assets/img/labels-product-{i:02d}.jpg?v=57'
              old_webp = f'assets/img/labels-product-{i:02d}.webp?v=57'
              new = f'assets/img/labels-product-{i:02d}.webp?v=58'
              s = s.replace(old_jpg, new).replace(old_webp, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit assembled assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labels.html assets/img/labels-product-*.webp
          git rm -r .asset-product-chunks
          git rm .github/workflows/assemble-label-products.yml
          git commit -m "assets: rebuild labels product images from original uploads"
          git push
