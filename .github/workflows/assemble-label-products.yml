name: Assemble final labels product gallery

on:
  push:
    branches: [main]
    paths:
      - '.asset-product-sprite-v61/TRIGGER'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble verified product sprite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/img
          cat .asset-product-sprite-v61/chunk-*.b64 | tr -d '\n\r ' | base64 -d > assets/img/labels-products-sprite.webp
          file assets/img/labels-products-sprite.webp
          test "$(stat -c%s assets/img/labels-products-sprite.webp)" -eq 150630
          echo "310de50cf3b7587714b06baedc11acdc58b858a4dc1b9c148e2f7a6d286b1794  assets/img/labels-products-sprite.webp" | sha256sum -c -

      - name: Point the nine fixed product cards at the sprite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('labels.html')
          s = p.read_text(encoding='utf-8')

          style = '''<style id="labels-product-sprite-style">
          .photo-card .ph.labels-product-sprite img{
            width:300%!important;
            height:auto!important;
            max-width:none!important;
            object-fit:fill!important;
            transform:var(--sprite-transform)!important;
            transform-origin:top left!important;
            transition:none!important;
          }
          .photo-card:hover .ph.labels-product-sprite img{
            transform:var(--sprite-transform)!important;
          }
          </style>
          '''
          if 'id="labels-product-sprite-style"' not in s:
              s = s.replace('</head>', style + '</head>', 1)

          products = [
              (1, '铜版纸标签', '铜版纸标签', 'translate(0,0)'),
              (2, '亮银逆向标签', '亮银逆向标签', 'translate(-33.333333%,0)'),
              (3, 'PVC哑膜标签', 'PVC哑膜', 'translate(-66.666667%,0)'),
              (4, 'PE合成纸覆光膜标签', 'PE合成纸覆光膜标签', 'translate(0,-33.333333%)'),
              (5, '镭射素面标签', '镭射素面标签', 'translate(-33.333333%,-33.333333%)'),
              (6, '纸张逆向标签', '纸张逆向标签', 'translate(-66.666667%,-33.333333%)'),
              (7, '珠光膜标签', '珠光膜标签', 'translate(0,-66.666667%)'),
              (8, '哑银哑膜标签', '哑银哑膜标签', 'translate(-33.333333%,-66.666667%)'),
              (9, '合成银增效工艺纳米逆向', '合成银增效工艺纳米逆向', 'translate(-66.666667%,-66.666667%)'),
          ]

          for i, alt, cap, transform in products:
              pattern = (
                  rf'      <div class="photo-card"><div class="ph"><img src="assets/img/labels-product-{i:02d}\.(?:jpg|webp)\?v=57" '
                  rf'alt="[^"]+" loading="lazy"></div><div class="cap">[^<]+</div></div>'
              )
              replacement = (
                  f'      <div class="photo-card"><div class="ph labels-product-sprite" '
                  f'style="--sprite-transform:{transform};"><img src="assets/img/labels-products-sprite.webp?v=58" '
                  f'alt="{alt}" loading="lazy"></div><div class="cap">{cap}</div></div>'
              )
              s, count = re.subn(pattern, replacement, s, count=1)
              if count != 1:
                  raise SystemExit(f'expected exactly one product card {i:02d}, got {count}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit final assets and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add labels.html assets/img/labels-products-sprite.webp
          git rm -f assets/img/labels-product-*.jpg assets/img/labels-product-*.webp || true

          for d in             .asset-product-sprite-v61             .asset-product-sprite-v59             .asset-product-sprite-v58             .asset-product-sprite-v61             .asset-product-chunks-v2             .asset-product-chunks             .asset-product-chunks-final; do
            [ ! -e "$d" ] || git rm -r "$d"
          done

          git rm .github/workflows/assemble-label-products.yml

          git commit -m "assets: finalize labels product gallery from original uploads"
          git push
