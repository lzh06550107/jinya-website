name: Finalize labels product gallery

on:
  push:
    branches: [main]
    paths:
      - '.asset-product-sprite-v61/TRIGGER'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify source sprite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/img
          cat .asset-product-sprite-v61/chunk-*.b64 | tr -d '\n\r ' | base64 -d > /tmp/labels-products-sprite.webp
          test "$(stat -c%s /tmp/labels-products-sprite.webp)" -eq 150630
          echo "310de50cf3b7587714b06baedc11acdc58b858a4dc1b9c148e2f7a6d286b1794  /tmp/labels-products-sprite.webp" | sha256sum -c -

      - name: Crop nine product images
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          rm -f assets/img/labels-product-*.jpg
          for i in 1 2 3 4 5 6 7 8 9; do
            row=$(( (i-1) / 3 ))
            col=$(( (i-1) % 3 ))
            x=$(( col * 360 ))
            y=$(( row * 270 ))
            printf -v n "%02d" "$i"
            convert /tmp/labels-products-sprite.webp -crop 360x270+${x}+${y} +repage -strip -quality 92 "assets/img/labels-product-${n}.webp"
            test -s "assets/img/labels-product-${n}.webp"
          done

      - name: Restore fixed product names and image references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('labels.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<style id="labels-product-sprite-style">.*?</style>\s*', '', s, flags=re.S)

          products = [
              ('铜版纸标签', '铜版纸标签'),
              ('亮银逆向标签', '亮银逆向标签'),
              ('PVC哑膜', 'PVC哑膜'),
              ('PE合成纸覆光膜标签', 'PE合成纸覆光膜标签'),
              ('镭射素面标签', '镭射素面标签'),
              ('纸张逆向标签', '纸张逆向标签'),
              ('珠光膜标签', '珠光膜标签'),
              ('哑银哑膜标签', '哑银哑膜标签'),
              ('合成银增效工艺纳米逆向', '合成银增效工艺纳米逆向'),
          ]

          lines = s.splitlines()
          first = next(i for i, line in enumerate(lines) if 'labels-product-01.' in line)
          last = next(i for i, line in enumerate(lines) if 'labels-product-09.' in line)
          if last - first != 8:
              raise SystemExit(f'unexpected product block: {first=} {last=}')

          block = []
          for idx, (alt, cap) in enumerate(products, 1):
              block.append(
                  f'      <div class="photo-card"><div class="ph"><img src="assets/img/labels-product-{idx:02d}.webp?v=58" '
                  f'alt="{alt}" loading="lazy"></div><div class="cap">{cap}</div></div>'
              )
          lines[first:last+1] = block
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Validate and commit final gallery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('labels.html').read_text(encoding='utf-8')
          expected = [
              '铜版纸标签','亮银逆向标签','PVC哑膜','PE合成纸覆光膜标签',
              '镭射素面标签','纸张逆向标签','珠光膜标签','哑银哑膜标签',
              '合成银增效工艺纳米逆向'
          ]
          refs = re.findall(r'assets/img/labels-product-(\d{2})\.webp\?v=58', s)
          assert refs == [f'{i:02d}' for i in range(1,10)], refs
          caps = re.findall(r'<div class="cap">([^<]+)</div>', s)
          pos = [caps.index(x) for x in expected]
          assert pos == sorted(pos), pos
          assert 'data:image' not in s
          assert 'labels-product-sprite-style' not in s
          PY

          for i in 01 02 03 04 05 06 07 08 09; do
            test -s "assets/img/labels-product-${i}.webp"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for d in .asset-*; do
            [ -e "$d" ] || continue
            git rm -r "$d"
          done

          git rm -f assets/img/labels-products-sprite.webp || true
          git add -A labels.html assets/img
          git commit -m "assets: finalize labels product images from original uploads"
          git push
