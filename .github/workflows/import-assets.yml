name: Import complete assets directory

on:
  push:
    branches: [main]
    paths:
      - '.import-assets/assets-full-r40.zip.part-*'

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and extract original assets
        shell: bash
        run: |
          set -euo pipefail
          cat .import-assets/assets-full-r40.zip.part-* > /tmp/assets-full-r40.zip
          unzip -o /tmp/assets-full-r40.zip
          rm -rf .import-assets

      - name: Verify imported assets
        shell: bash
        run: |
          set -euo pipefail
          test -d assets
          count="$(find assets -type f | wc -l | tr -d ' ')"
          echo "assets file count: $count"
          test "$count" -eq 142

      - name: Commit complete assets directory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets .import-assets
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "assets: import complete original assets directory"
          git push
