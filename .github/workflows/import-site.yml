name: Import site bundle

on:
  push:
    branches:
      - main
    paths:
      - site-upload-r40.zip

permissions:
  contents: write

jobs:
  import-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract site bundle
        run: |
          unzip -o site-upload-r40.zip
          rm site-upload-r40.zip

      - name: Commit extracted site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Jinya website R40 full-screen banner"
          git push
