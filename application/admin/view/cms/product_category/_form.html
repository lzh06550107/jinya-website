<form class="form-horizontal" role="form" data-toggle="validator" method="POST" action=""><div class="form-group"><label class="control-label col-xs-12 col-sm-2">分类名称:</label><div class="col-xs-12 col-sm-8"><input id="c-name" class="form-control" name="row[name]" type="text" value="{$row.name|default=''|htmlentities}" placeholder="" data-rule="required"></div></div><div class="form-group"><label class="control-label col-xs-12 col-sm-2">父分类:</label><div class="col-xs-12 col-sm-8">{:build_select('row[parent_id]', $parentList, isset($row['parent_id'])?$row['parent_id']:0, ['class'=>'form-control selectpicker'])}</div></div><div class="form-group"><label class="control-label col-xs-12 col-sm-2">简称:</label><div class="col-xs-12 col-sm-8"><input id="c-short_name" class="form-control" name="row[short_name]" type="text" value="{$row.short_name|default=''|htmlentities}" placeholder=""></div></div><div class="form-group"><label class="control-label col-xs-12 col-sm-2">URL 标识:</label><div class="col-xs-12 col-sm-8"><input id="c-slug" class="form-control" name="row[slug]" type="text" value="{$row.slug|default=''|htmlentities}" placeholder="" data-rule="required;alphaDash"></div></div><div class="form-group"><label class="control-label col-xs-12 col-sm-2">说明:</label><div class="col-xs-12 col-sm-8"><textarea id="c-description" class="form-control " rows="5" name="row[description]">{$row.description|default=''|htmlentities}</textarea></div></div><div class="form-group"><label class="control-label col-xs-12 col-sm-2">SEO 标题:</label><div class="col-xs-12 col-sm-8"><input id="c-seo_title" class="form-control" name="row[seo_title]" type="text" value="{$row.seo_title|default=''|htmlentities}" placeholder=""></div></div><div class="form-group"><label class="control-label col-xs-12 col-sm-2">SEO 关键词:</label><div class="col-xs-12 col-sm-8"><input id="c-seo_keywords" class="form-control" name="row[seo_keywords]" type="text" value="{$row.seo_keywords|default=''|htmlentities}" placeholder=""></div></div><div class="form-group"><label class="control-label col-xs-12 col-sm-2">SEO 描述:</label><div class="col-xs-12 col-sm-8"><textarea id="c-seo_description" class="form-control " rows="3" name="row[seo_description]">{$row.seo_description|default=''|htmlentities}</textarea></div></div><div class="form-group"><label class="control-label col-xs-12 col-sm-2">排序:</label><div class="col-xs-12 col-sm-8"><input id="c-weigh" class="form-control" name="row[weigh]" type="text" value="{$row.weigh|default=''|htmlentities}" placeholder="" data-rule="integer"></div></div><div class="form-group"><label class="control-label col-xs-12 col-sm-2">状态:</label><div class="col-xs-12 col-sm-8">{:build_radios('row[status]', $statusList, isset($row['status'])?$row['status']:'normal')}</div></div><div class="form-group layer-footer"><label class="control-label col-xs-12 col-sm-2"></label><div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">保存</button><button type="reset" class="btn btn-default btn-embossed">重置</button></div></div></form>
