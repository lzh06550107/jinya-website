<form class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">客户:</label>
        <div class="col-xs-12 col-sm-8"><p class="form-control-static">{$row.name|htmlentities}</p></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">客户状态:</label>
        <div class="col-xs-12 col-sm-8">{:build_select('status', $statusList, $row.status, ['class'=>'form-control selectpicker'])}</div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-3"></label>
        <div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">更新状态</button></div>
    </div>
</form>
