<form class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">客户:</label>
        <div class="col-xs-12 col-sm-8"><p class="form-control-static">{$row.name|htmlentities} / {$row.company|htmlentities}</p></div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-3">负责人:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-admin_id" class="form-control selectpage" name="admin_id" type="text"
                   value="{$row.assigned_admin_id|default=''}" data-source="auth/admin/index"
                   data-field="nickname" data-primary-key="id" data-rule="required">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-3"></label>
        <div class="col-xs-12 col-sm-8"><button type="submit" class="btn btn-primary btn-embossed disabled">确认分配</button></div>
    </div>
</form>
