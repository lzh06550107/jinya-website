<div class="panel panel-default panel-intro">
    <div class="panel-heading">{:build_heading(null,false)}</div>
    <div class="panel-body">
        <div class="alert alert-info">
页面结构与功能块由严格克隆模板固定。这里统一管理页面配置、功能块和单页正文内容；正文仍保存到原页面内容数据源。
        </div>
        <div id="toolbar" class="toolbar">
            {:build_toolbar('refresh')}
            {if condition="$auth->check('cms/page/index')"}
            <a href="{:url('cms/page/index',['from'=>'page_config'])}" class="btn btn-success btn-addtabs" title="页面内容库"><i class="fa fa-file-text-o"></i> 页面内容库</a>
            {/if}
        </div>
        <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
               data-operate-edit="{:$auth->check('cms/page_config/edit')}"
               width="100%"></table>
    </div>
</div>
