<div class="page-header"><h4>标题与文案</h4></div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">PC 标题:</label><div class="col-xs-12 col-sm-4"><input class="form-control" name="[inputPrefix][title]" value="{$[rowVar].title|default=''|htmlentities}"></div>
    <label class="control-label col-xs-12 col-sm-2">移动标题（留空继承 PC）:</label><div class="col-xs-12 col-sm-4"><input class="form-control" name="[inputPrefix][mobile_title]" value="{$[rowVar].mobile_title|default=''|htmlentities}" placeholder="留空时使用 PC 标题"></div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">PC 副标题:</label><div class="col-xs-12 col-sm-4"><input class="form-control" name="[inputPrefix][subtitle]" value="{$[rowVar].subtitle|default=''|htmlentities}"></div>
    <label class="control-label col-xs-12 col-sm-2">移动副标题（留空继承 PC）:</label><div class="col-xs-12 col-sm-4"><input class="form-control" name="[inputPrefix][mobile_subtitle]" value="{$[rowVar].mobile_subtitle|default=''|htmlentities}" placeholder="留空时使用 PC 副标题"></div>
</div>
<div class="page-header"><h4>模块跳转</h4></div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">模块标题跳转 URL:</label><div class="col-xs-12 col-sm-10"><input class="form-control" name="[inputPrefix][more_url]" value="{$[rowVar].more_url|default=''|htmlentities}" placeholder="例如：/news"></div>
</div>
<div class="page-header"><h4>PC 新闻栏目</h4></div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">左侧栏目标题:</label><div class="col-xs-12 col-sm-4"><input class="form-control" name="[inputPrefix][config_left_title]" value="{$[rowVar].config_left_title|default=''|htmlentities}"></div>
    <label class="control-label col-xs-12 col-sm-2">左侧栏目跳转 URL:</label><div class="col-xs-12 col-sm-4"><input class="form-control" name="[inputPrefix][config_left_url]" value="{$[rowVar].config_left_url|default=''|htmlentities}"></div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">右侧栏目标题:</label><div class="col-xs-12 col-sm-4"><input class="form-control" name="[inputPrefix][config_right_title]" value="{$[rowVar].config_right_title|default=''|htmlentities}"></div>
    <label class="control-label col-xs-12 col-sm-2">右侧栏目跳转 URL:</label><div class="col-xs-12 col-sm-4"><input class="form-control" name="[inputPrefix][config_right_url]" value="{$[rowVar].config_right_url|default=''|htmlentities}"></div>
</div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">PC 栏目“更多”文字:</label><div class="col-xs-12 col-sm-10"><input class="form-control" name="[inputPrefix][more_text]" value="{$[rowVar].more_text|default=''|htmlentities}"><p class="help-block">以上栏目字段仅用于 PC 首页新闻双栏布局。</p></div>
</div>
<div class="page-header"><h4>首页新闻</h4></div>
<div class="form-group">
    <label class="control-label col-xs-12 col-sm-2">PC 显示上限（0 = 全部）:</label><div class="col-xs-12 col-sm-4"><input class="form-control" type="number" min="0" name="[inputPrefix][pc_display_count]" value="{$[rowVar].pc_display_count|default='0'|htmlentities}"></div>
    <label class="control-label col-xs-12 col-sm-2">移动端显示上限（0 = 全部）:</label><div class="col-xs-12 col-sm-4"><input class="form-control" type="number" min="0" name="[inputPrefix][mobile_display_count]" value="{$[rowVar].mobile_display_count|default='0'|htmlentities}"></div>
</div>
<div class="form-group"><div class="col-xs-12 col-sm-offset-2 col-sm-10"><p class="help-block">PC 新闻顺序会影响重点新闻与后续列表位置；移动端按选择顺序输出。新闻内容及顺序由“首页新闻”配置管理。</p></div></div>
