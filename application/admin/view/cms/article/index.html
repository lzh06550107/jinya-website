<div class="panel panel-default panel-intro">
    <div class="panel-heading">{:build_heading(null, false)}</div>
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh,add')}
            </div>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                   data-operate-edit="{:$auth->check('cms/article/edit')}"
                   data-operate-del="{:$auth->check('cms/article/del')}"
                   data-operate-submit="{:$auth->check('cms/article/submit')}"
                   data-operate-publish="{:$auth->check('cms/article/publish')}"
                   data-operate-reject="{:$auth->check('cms/article/reject')}"
                   data-operate-offline="{:$auth->check('cms/article/offline')}"
                   data-operate-duplicate="{:$auth->check('cms/article/duplicate')}"
                   width="100%"></table>
        </div>
    </div>
</div>
