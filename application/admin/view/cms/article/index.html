<div class="panel panel-default panel-intro">
    <div class="panel-heading">{:build_heading(null, false)}</div>
    <div class="panel-body">
        <div class="widget-body no-padding">
            <div id="toolbar" class="toolbar">
                {:build_toolbar('refresh,add,edit')}
                <div class="btn-group {:$auth->check('cms/article/submit')||$auth->check('cms/article/publish')||$auth->check('cms/article/offline')?'':'hide'}">
                    <button type="button" class="btn btn-default dropdown-toggle btn-disabled disabled" data-toggle="dropdown"><i class="fa fa-tasks"></i> 批量操作 <span class="caret"></span></button>
                    <ul class="dropdown-menu">
                        <li class="{:$auth->check('cms/article/submit')?'':'hide'}"><a href="javascript:;" class="btn-cms-batch" data-action="submit"><i class="fa fa-send"></i> 提交审核</a></li>
                        <li class="{:$auth->check('cms/article/publish')?'':'hide'}"><a href="javascript:;" class="btn-cms-batch" data-action="publish"><i class="fa fa-check"></i> 批量发布</a></li>
                        <li class="{:$auth->check('cms/article/offline')?'':'hide'}"><a href="javascript:;" class="btn-cms-batch" data-action="offline"><i class="fa fa-arrow-down"></i> 批量下架</a></li>
                    </ul>
                </div>
                <a href="javascript:;" class="btn btn-danger btn-recyclebin {:$auth->check('cms/article/recyclebin')?'':'hide'}"><i class="fa fa-recycle"></i> 回收站</a>
            </div>
            <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                   data-operate-edit="{:$auth->check('cms/article/edit')}"
                   data-operate-del="{:$auth->check('cms/article/del')}"
                   data-operate-submit="{:$auth->check('cms/article/submit')}"
                   data-operate-publish="{:$auth->check('cms/article/publish')}"
                   data-operate-reject="{:$auth->check('cms/article/reject')}"
                   data-operate-offline="{:$auth->check('cms/article/offline')}"
                   data-operate-duplicate="{:$auth->check('cms/article/duplicate')}"
                   width="100%"></table>
        </div>
    </div>
</div>
