<section class="hero hero--inner contact-generated-hero">
  <div class="inner-hero-bg contact-generated-hero-bg"{notempty name="block.image"} style="background-image:url('{$block.image|htmlentities}');"{/notempty}></div>
  <div class="container"><div class="hero-text"><h1>{$block.title|htmlentities|nl2br}</h1>{notempty name="block.content_inline_html"}<p class="lede">{$block.content_inline_html}</p>{/notempty}{notempty name="block.link_text"}<a href="{if !empty($block.link_url)}{$block.link_url|htmlentities}{else /}/page/contact#contact-info{/if}" class="hero-cta">{$block.link_text|htmlentities}</a>{/notempty}</div></div>
</section>
