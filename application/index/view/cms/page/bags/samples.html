<section class="section section--alt"><div class="container" data-tab-scope><div class="section-head"><h2>{$block.title|htmlentities}</h2><p class="eyebrow">{$block.subtitle|htmlentities}</p><div class="dash"></div></div>{if condition="!empty($block.extra.tabs_items)"}<div class="gallery-tabs" data-tabs>{volist name="block.extra.tabs_items" id="tab"}<button type="button" data-tab="{$tab.value|htmlentities}" {if condition="$i eq 1"}class="active"{/if}>{$tab.label|htmlentities}</button>{/volist}</div>{/if}<div class="grid grid-4">{volist name="block.extra.items" id="item"}<div class="photo-card" data-tab-groups="{$item.group|default=''|htmlentities}"><div class="ph"><img alt="{$item.title|htmlentities}" loading="lazy" src="{$item.image|htmlentities}"></div><div class="cap">{$item.title|htmlentities}</div></div>{/volist}</div></div></section>
