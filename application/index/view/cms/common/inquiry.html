<div class="cms-inquiry-box"><div class="cms-inquiry-inner"><div class="cms-inquiry-copy"><h2>{$inquiryTitle|default='获取产品资料与工程方案'|htmlentities}</h2>{if !empty($inquirySubtitle)}<p>{$inquirySubtitle|htmlentities}</p>{/if}</div><form class="cms-inquiry-form" method="post" action="/inquiry/submit"><input type="hidden" name="__token__" value="{$cmsInquiryToken|default=''|htmlentities}"><input type="hidden" name="source_title" value="{$title|default=''|htmlentities}"><div class="form-row"><input name="name" placeholder="您的姓名 *" required><input name="mobile" placeholder="联系电话 *" required></div><div class="form-row"><input name="company" placeholder="公司名称"><input name="city" placeholder="所在城市"></div><textarea name="content" rows="3" maxlength="2000" required placeholder="请填写产品、面积、施工环境或其他需求"></textarea><button type="submit">{$inquiryButtonText|default='提交咨询'|htmlentities}</button><span class="cms-form-message" aria-live="polite"></span></form></div></div>
